<header>
  <h1>Consultorio odontológico</h1>
  <label>
    Doctor
    <select #sel (change)="elegir(+sel.value)">
      <option value="">Elegí un doctor</option>
      @for (d of doctores(); track d.id) {
        <option [value]="d.id">{{ d.apellido }}, {{ d.nombre }}</option>
      }
    </select>
  </label>
</header>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (sesion.doctorActual()) {
  <nav>
    <button type="button" [class.activo]="seccion() === 'agenda'" (click)="seccion.set('agenda')">Agenda</button>
    <button type="button" [class.activo]="seccion() === 'pacientes'" (click)="seccion.set('pacientes')">Pacientes</button>
  </nav>

  <main>
    @switch (seccion()) {
      @case ('agenda') { <app-turnos /> }
      @case ('pacientes') { <app-pacientes /> }
    }
  </main>
} @else if (!error()) {
  <p>Elegí un doctor para ver su agenda.</p>
}
